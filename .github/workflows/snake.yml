name: Generate profile graphics

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 活动图 action 的 pnpm 缓存 key 用 hashFiles('**/pnpm-lock.yaml')，
      # 按工作区解析；不 checkout 工作区为空会导致该步骤失败
      - uses: actions/checkout@v6

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate activity graph
        id: activity
        # 先不让它中断 job，好让下面的诊断步骤把失败原因打出来
        continue-on-error: true
        # v1 tag 缺少 pnpm 缓存路径修复（见 issue #1），钉到修复后的 commit
        uses: maurodesouza/github-readme-activity-graph-action@9b38b03cac7ffb9f093a82f0ea9c634d5df62297
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-dark&bg_color=00000000&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 无论成败都跑，把实际状态打进日志
      - name: Report activity graph outcome
        if: always()
        run: |
          echo "activity step outcome: ${{ steps.activity.outcome }}"
          echo "--- dist/ contents ---"
          ls -la dist/ 2>&1 || echo "(no dist/ directory)"
          if [ -f dist/activity-graph.svg ]; then
            echo "--- activity-graph.svg (first 400 chars) ---"
            head -c 400 dist/activity-graph.svg; echo
          fi

      # 蛇形图必须存在且够大；活动图缺失时只警告，不阻断发布
      - name: Verify generated files
        run: |
          for f in dist/github-contribution-grid-snake.svg \
                   dist/github-contribution-grid-snake-dark.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"; exit 1
            fi
            size=$(wc -c < "$f")
            if [ "$size" -lt 2000 ]; then
              echo "::error::$f is only ${size}B — likely an error placeholder"
              cat "$f"; exit 1
            fi
            echo "ok: $f (${size}B)"
          done
          if [ -f dist/activity-graph.svg ]; then
            size=$(wc -c < dist/activity-graph.svg)
            if [ "$size" -lt 2000 ]; then
              echo "::warning::activity-graph.svg is only ${size}B — dropping it"
              rm dist/activity-graph.svg
            else
              echo "ok: dist/activity-graph.svg (${size}B)"
            fi
          else
            echo "::warning::activity-graph.svg was not generated"
          fi

      - name: Publish generated files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
